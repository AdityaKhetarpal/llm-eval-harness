name: Generate the support-bot answers

# Runs every version of the Voltkart support bot (examples/support_bot/variants.yaml) on all 44 messages
# with free local Qwen models on the runner's CPU, then commits the answers so evalgate can replay them.
#
# Set "from_run" to the id of an earlier run to skip the slow part and only publish the answers it saved
# (GitHub keeps them for 90 days).
on:
  workflow_dispatch:
    inputs:
      variants:
        description: 'JSON list of versions to run'
        required: false
        default: '["v1-3b", "v2-3b", "v1-1.5b", "v3-3b"]'
      from_run:
        description: 'Only publish the answers saved by this earlier run id (leave empty to generate new ones)'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  answer:
    if: inputs.from_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers accelerate
          pip install -q -e .
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-gen-${{ matrix.variant }}
      - name: Answer all 44 messages
        run: python scripts/generate_support_runs.py "${{ matrix.variant }}"
      - uses: actions/upload-artifact@v4
        with:
          name: answers-${{ matrix.variant }}
          path: examples/support_bot/runs/

  publish:
    needs: answer
    if: always() && needs.answer.result != 'cancelled' && needs.answer.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      # the LATEST main, not the commit this run started from: other commits may have landed in the meantime
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: answers-*
          path: answers
          merge-multiple: true
          run-id: ${{ inputs.from_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Publish the answers
        run: |
          pip install -q -e .
          git config user.name "Aditya Khetarpal"
          git config user.email "80028073+AdityaKhetarpal@users.noreply.github.com"
          ls -la answers
          # the data files are rebuilt from scratch on top of the latest main each time,
          # so a commit that landed meanwhile can never cause a conflict
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p examples/support_bot/runs baselines
            cp answers/* examples/support_bot/runs/
            evalgate run examples/support_bot/suite.yaml --label "v1-3b (live)" -q --out baselines/support-bot.json
            python scripts/build_site_data.py
            git add examples/support_bot/runs baselines web/data/site.json
            if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
            git commit -q -m "Support bot answers $(date -u +%Y-%m-%d)"
            if git push origin HEAD:main; then echo "Published."; exit 0; fi
            echo "Push failed (attempt $attempt), retrying in 20 seconds..."; sleep 20
          done
          echo "Could not publish after 3 attempts."; exit 1
