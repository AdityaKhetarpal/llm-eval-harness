name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q

      # The gate itself, used the way a team would use it
      - name: Eval gate (latest answers vs the baseline)
        run: |
          evalgate gate examples/text_to_sql/suite.yaml --baseline baselines/text-to-sql.json -q
          evalgate gate examples/text_to_sql/clarify.yaml --baseline baselines/text-to-sql-clarify.json -q

      # Proof that the gate really blocks a bad change: the 19 Oct build (1.5B model) must FAIL
      - name: The gate must block a known regression
        run: |
          if evalgate gate examples/text_to_sql/suite.yaml --baseline baselines/text-to-sql.json \
               --outputs examples/text_to_sql/runs/2026-10-19-1.5B.jsonl -q > /dev/null; then
            echo "The gate let a 22.5-point regression through"; exit 1
          fi
          echo "Blocked, as it should be."

      - name: Use the reusable action on this repo
        uses: ./
        with:
          suite: examples/text_to_sql/suite.yaml
          baseline: baselines/text-to-sql.json

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
