name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q

      # The gate itself, used the way a team would use it (once the saved answers exist)
      - name: Eval gate (live answers vs the baseline)
        if: hashFiles('baselines/support-bot.json') != ''
        run: evalgate gate examples/support_bot/suite.yaml --baseline baselines/support-bot.json -q

      - name: Use the reusable action on this repo
        if: hashFiles('baselines/support-bot.json') != ''
        uses: ./
        with:
          suite: examples/support_bot/suite.yaml
          baseline: baselines/support-bot.json

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
