[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalgate"
version = "0.1.0"
description = "Test any LLM app against a fixed question set, block regressions in CI, and check that your AI judge agrees with humans."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aditya Khetarpal" }]
keywords = ["llm", "evaluation", "evals", "llm-as-judge", "ci", "regression-testing"]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
local = ["torch", "transformers>=4.45", "accelerate"]
data = ["huggingface_hub>=0.24"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
evalgate = "evalgate.cli:main"

[project.urls]
Homepage = "https://github.com/AdityaKhetarpal/llm-eval-harness"

[tool.setuptools.packages.find]
include = ["evalgate*"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]  # zip() is always over lists of equal length here

[tool.ruff.lint.per-file-ignores]
"evalgate/report.py" = ["E501"]  # the embedded HTML/CSS template

[tool.pytest.ini_options]
testpaths = ["tests"]
